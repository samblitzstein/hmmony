<style>
/* Layout: a studio (players' shelf, books, a stage behind a curtain); a book opens full screen, one level per page. */
:root{
  --wall:#efe4cf; --wall2:#e6d9be; --card:#fffdf7; --ink:#3b3a22; --rope:#6f6a45; --shadow:rgba(50,50,20,.28); --accent2:#c0612b;

  --ribbon:#f4e8c8; --ribbon2:#b9a77a; --velvet:#6a4636; --velvet2:#52342a; --line:#ddd2c0;
  --paper:#eef0df; --paper2:#e1e5cc; --tab:#a6b07a; --tab2:#7f8a52; --cloth:var(--moss);
  --sat:min(env(safe-area-inset-top,0px),62px); --sab:env(safe-area-inset-bottom,0px);   /* at most a phone's own status bar: an app that reports its toolbar as safe area too pushed the page's top things down (Sam: too low) */
  --display:"Fraunces",Georgia,serif; --body:"Atkinson Hyperlegible",system-ui,sans-serif;
}

    --moss:#4d5826; --slate:#3f4852; --ochre:#7a5c19; --tan:#7a6040; --plank:#7a5f3c; --plank2:#5e4830;
    --ribbon:#d8c9a2; --ribbon2:#8f8060; --velvet:#4a2f25; --velvet2:#38231b; --line:#3a3027;
    --paper:#262a1d; --paper2:#2e3323; --tab:#5d6838; --tab2:#48512b}
  :root:not([data-theme="light"])[data-book="warm"]{--paper:#2e2722; --paper2:#362e27; --card:#3e362f; --tab:#7a5f3c; --tab2:#5e4830}}
:root[data-theme="dark"]{color-scheme:dark;
  --wall:#2a2420; --wall2:#322a24; --card:#3a3f2c; --ink:#ecebd8; --rope:#c4bf98; --shadow:rgba(0,0,0,.6); --accent2:#e8955a;
  --moss:#4d5826; --slate:#3f4852; --ochre:#7a5c19; --tan:#7a6040; --plank:#7a5f3c; --plank2:#5e4830;
  --ribbon:#d8c9a2; --ribbon2:#8f8060; --velvet:#4a2f25; --velvet2:#38231b; --line:#3a3027;
  --paper:#262a1d; --paper2:#2e3323; --tab:#5d6838; --tab2:#48512b}

/* the game's own names for these colours */
:root{--bg:var(--wall); --fg:var(--ink); --mute:color-mix(in srgb,var(--ink) 62%,transparent); --panel:var(--card); --accent:var(--accent2); --accent-ink:var(--card);
  --stage:var(--paper); --wood:var(--tab); --wood-edge:var(--tab2); --mstr:var(--ink); --slot:var(--tab2); --carry:var(--ink); --reset-bg:var(--tab); --reset-fg:var(--ink)}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--wall);color:var(--ink);font-family:var(--body);line-height:1.45;transition:background .6s}
body{background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.45}
.wrap{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;display:grid;gap:14px}

.stage{background:var(--stage);border-radius:14px;padding:6px}

svg .waiting{opacity:0!important;pointer-events:none!important}
/* an instrument that hasn't played yet: colourless outline. Colour = it has made sound. Touching it (tap or drag) wakes it at any time, even before the gate is tapped */
/* (asleep looks: no colour, half see-through. Drawn by an SVG filter per element (wakeLook), so it works in every browser and fades) */

svg.dim > :not(.gate):not(.setup):not(.woke):not(.hint):not(.bookbtn):not(.bookview):not(.curtain){opacity:.2;pointer-events:none}
svg > *{transition:opacity .5s,filter .5s}   /* nothing jumps: every state change fades */
.tap{cursor:pointer}
svg .tap,svg .gate{-webkit-tap-highlight-color:transparent;outline:none}
/* invisible tap areas: never painted, still catch taps */
.hitarea,.handle{fill:#000;fill-opacity:0;stroke:none;visibility:hidden;pointer-events:all;-webkit-tap-highlight-color:transparent}
.handle{cursor:grab;touch-action:none}
.pulley .pwheel{fill:var(--stage);stroke:var(--mstr);stroke-width:2}
/* whatever carries sound up stands in front of the ledges, on its own solid backing, so it clearly crosses over them */
.pulley .pshaft{fill:var(--panel);stroke:var(--wood-edge);stroke-width:1.6}
.pulley .prail{stroke:var(--wood-edge);stroke-width:1.4;opacity:.6}
.pulley .prope{stroke:var(--rope);stroke-width:1.4}

@keyframes chainup{to{stroke-dashoffset:-10}}   /* the line is drawn bottom to top, so a falling offset moves the links up */
.pulley .brass{fill:#e3bf6e;stroke:#8a6420;stroke-width:1.6;stroke-linejoin:round}

.pulley .dark{fill:#5a3e1c}
.mstr{stroke:var(--mstr);stroke-width:2.2;fill:none;stroke-linecap:round;transition:opacity .15s}
/* the instrument's own string: faded in its own color while quiet. While it plays it stays its own color, a little lighter, with a small soft glow.

.mstr.own{stroke:#5d5a66;opacity:.8;stroke-width:1.5;transition:stroke-width .9s ease-out}   /* pencil and wash: a pencil line; the colour is the seep's (seepIn) */
.mstr.own.ringing{stroke-width:1.7;transition:stroke-width .18s ease-out}

/* every place a string can be tied on (instruments, the lift, gates) is the same brass eyelet: a gold ring with a hole */

circle.inring.hot{stroke:var(--accent);stroke-width:4.2;fill:#4a2f16}
/* while a string is being dragged: everything below the line it can reach is tinted, and the line says where "below" starts */
.dguide{pointer-events:none;opacity:0;transition:opacity .9s}
.dguide.on{opacity:1}
.dguide .zone{fill:var(--accent);opacity:.14}
/* rows: every instrument stands on a ledge, and a string can only go to an instrument on a lower ledge */
.band{fill:var(--wood-edge);pointer-events:none}
.ledge{pointer-events:none;transition:opacity .8s}
.ledge .ltop{fill:var(--accent2);opacity:0;transition:opacity .8s}
.ledge.lit .ltop{opacity:.55} .ledge.dim{opacity:.35}
.gcard{fill:var(--card)}
.onward{stroke:var(--rope);stroke-width:2;stroke-dasharray:2 5;opacity:.35;transition:opacity .6s}
.onward.lit{opacity:1;stroke-dasharray:none}
/* the gate has no color of its own, so it never reads as one of the notes */

.gbody{stroke-opacity:.9;transition:stroke-opacity .6s}
.gate.open .gbody{stroke-opacity:1}
.gslot{display:none}
.gbody,.gpipe{transition:fill .5s,stroke .5s,stroke-width .5s,stroke-opacity .6s}
.gbody{fill:#e3bf6e;stroke:#8a6420;stroke-width:3}

.gholeline{fill:none;stroke:#8a6420;stroke-width:1;pointer-events:none}   /* a thin outline around each hole in the gate, thinner than the gate's own rim */
.gpipe{fill:#000;stroke:none}   /* inside the gate's mask: black = a clear hole you can see the page through */
.curtain rect.cloth{fill:var(--velvet)} .curtain path{stroke:var(--velvet2);stroke-width:3;fill:none;opacity:.7} .curtain rect.hem{fill:#c79a3e}
.audience{pointer-events:none} .tomato{fill:#d2452f} .splat{fill:#c23a26} .rose circle{fill:#c8264b} .rose path{stroke:#3f7d3a;stroke-width:1.6;fill:none;stroke-linecap:round}
.stayed{font:700 15px var(--body);fill:#f6e7cf}
.chaptitle.oncurtain{fill:#f6e7cf}
.notelabel{font:700 11px var(--body);fill:var(--carry);pointer-events:none}
.notelabel.gate{font-weight:400;font-size:10.5px}
/* a paper shop tag tied to the pitch pipe says what kind of match it wants; it swings when the pipe is shaken and fills with the notes' colours while a right note is passing */
.gtag rect{stroke:#4a2f16;stroke-width:1}

.gtag path{fill:none;stroke:#9b7d5c;stroke-width:1.2;stroke-linecap:round}
.notelegend{font:10.5px var(--body);fill:var(--mute);pointer-events:none}

.bookbtn text{font:700 11px var(--body);fill:var(--reset-fg)}
.bookview .bg{fill:var(--stage)} .bookview .btitle{font:700 18px var(--display);fill:var(--carry)}

.bookview .page text{font:700 12px var(--body);fill:var(--carry)}

.earmark .pip{fill:none;stroke:var(--reset-fg);stroke-width:1.3} .earmark .pipf{fill:var(--reset-fg);transition:opacity .6s}
.gslotdecor{pointer-events:none} .ghook{fill:none;stroke:#5a3e1c;stroke-width:1.8;stroke-linecap:round} .gfilter{fill:#efe2bf;stroke:#5a3e1c;stroke-width:1.1;stroke-linejoin:round} .gfmesh{stroke:#5a3e1c;stroke-width:.5;opacity:.7} .gspout{fill:none;stroke:#5a3e1c;stroke-width:5;stroke-linecap:round} .gspout2{fill:none;stroke:#c9a35c;stroke-width:3;stroke-linecap:round} .hrail{stroke:var(--wood-edge);stroke-width:3;stroke-linecap:round} .hpeg{fill:var(--wood-edge)} .gcrack{fill:none;stroke:#5a3e1c;stroke-width:1.2;stroke-linecap:round} .gpin{stroke:#5a3e1c;stroke-width:1} .gbeadstr{stroke:var(--rope);stroke-width:1.2}

.hist{pointer-events:none} .hist .staffln{stroke:var(--carry);stroke-width:.8;opacity:.35} .hist .bar{stroke:var(--carry);stroke-width:1;opacity:.5} .hist .bar2{stroke:var(--carry);stroke-width:2.4;opacity:.6}
.bookview .page .staffln{stroke:var(--carry);stroke-width:.5;opacity:.35} .bookview .page .bar{stroke:var(--carry);stroke-width:.7;opacity:.6} .bookview .page .bar2{stroke:var(--carry);stroke-width:1.4;opacity:.7}
.stamp{pointer-events:none} .stamp .ring{fill:none;stroke:var(--accent);stroke-width:2.2} .stamp .ring2{fill:none;stroke:var(--accent);stroke-width:.9;opacity:.7}
.stamp .seal{fill:var(--accent)} .stamp .sealin{fill:none;stroke:var(--stage);stroke-width:1.2;opacity:.7} .stamp .sealstar,.stamp .sealdot{fill:var(--stage)}
.stamp .petal{fill:var(--accent);opacity:.85} .stamp .petal.gone{fill:none;stroke:var(--accent);stroke-width:1;stroke-dasharray:2 2;opacity:.45}
.stamp .pipf{fill:var(--accent)} .stamp .pip{fill:none;stroke:var(--accent);stroke-width:1.1} .stamp .tally{stroke:var(--accent);stroke-width:2;stroke-linecap:round} .stamp .star{fill:var(--accent)}
.offer{cursor:pointer} .offer .pill{fill:var(--panel);stroke:var(--accent);stroke-width:2} .offer .fork{fill:none;stroke:var(--carry);stroke-width:1.6;stroke-linecap:round}
.offer .pip{fill:none;stroke:var(--carry);stroke-width:1.3} .offer .pipf{fill:var(--carry)} .offer .newpip{fill:var(--accent)} .offer .arrow{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.bookview .earpick .pill{fill:var(--panel);stroke:var(--rope);stroke-width:1.4} .bookview .earpick .pip{fill:var(--panel);stroke:var(--carry);stroke-width:1.4;cursor:pointer}
.bookview .earpick .pip.on{fill:var(--carry)} .bookview .earpick .fork{fill:none;stroke:var(--carry);stroke-width:1.6;stroke-linecap:round}
.diffview .bg{fill:var(--stage)} .diffview .dtitle{font:700 20px var(--display);fill:var(--carry)}
.diffview .dsub{font:12px var(--body);fill:var(--carry);opacity:.85}
.diffview .card{cursor:pointer}
.diffview .card rect{fill:var(--panel);stroke:var(--rope);stroke-width:1.4}
.diffview .card.here rect{fill:var(--wood);stroke:var(--accent);stroke-width:2.6}
.diffview .card .cname{font:700 17px var(--display);fill:var(--carry)}
.diffview .card .cdesc{font:12px var(--body);fill:var(--carry)}
svg.flipup{transform-origin:center top;animation:flipup .45s ease-in forwards}
@keyframes flipup{from{transform:perspective(900px) rotateX(0);opacity:1}to{transform:perspective(900px) rotateX(-95deg);opacity:.2}}
svg.flipin{animation:flipin .35s ease-out}
@keyframes flipin{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
.puff{fill:none;stroke:var(--carry);stroke-width:1.4;stroke-linecap:round;pointer-events:none}
/* no CSS opacity on strands: it would override their per-frame fades */
.wig{fill:none;stroke-linecap:round;pointer-events:none}
.hint{transition:opacity .45s;pointer-events:none}
.floor{fill:var(--wood);opacity:.35;pointer-events:none}
.floorline{stroke:var(--wood-edge);stroke-width:1.5;opacity:.35;pointer-events:none}
.mote{fill:var(--rope);pointer-events:none;display:none}   /* falling dust and drops are gone (Sam): only watercolour moves */
.hintword{font:12px var(--body);fill:var(--carry);letter-spacing:.04em}
.booktitle{font:11px var(--body);fill:var(--carry);opacity:.7;letter-spacing:.12em;text-transform:uppercase}
.chaptitle{font:700 17px var(--display);fill:var(--carry)}
.cue{fill:none;stroke:var(--accent);stroke-width:1.6;pointer-events:none}
.cuepath{stroke-dasharray:2 5;stroke-linecap:round}
.cuedot{fill:var(--accent);pointer-events:none}
.bodyf{fill:var(--wood)}
.th-soft{stroke:var(--wood-edge);stroke-width:2;stroke-linejoin:round}
.knob{fill:var(--wood-edge)}
.eye{fill:var(--carry);transition:opacity .12s}
.shut{fill:none;stroke:var(--carry);stroke-width:.8;stroke-linecap:round;transition:opacity .12s}
.next{cursor:pointer}
.nextbtn{fill:var(--panel);stroke:var(--accent);stroke-width:2}
.next path{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nextring{fill:none;stroke:var(--accent);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center}

@keyframes nextpulse{from{transform:scale(1);opacity:.6}to{transform:scale(1.8);opacity:0}}
svg.leaving{opacity:0;transition:opacity .35s}
svg{transition:opacity .35s}
.reset circle{fill:var(--reset-bg)} .reset path{stroke:var(--reset-fg);stroke-width:2.5;fill:none;stroke-linecap:round}
.levelnote{font-size:.85rem;color:var(--mute);background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;display:grid;gap:2px}
.levelnote b{color:var(--fg)}
.levelnote[hidden]{display:none}
.switches{display:grid;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.switches .note{margin:0;color:var(--mute);font-size:.9rem}
.grp{display:grid;gap:6px}
.lbl{font-weight:700;font-size:.95rem}
.numin{font:inherit;width:6em;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:inherit}
.seg,.rowbtns{display:flex;flex-wrap:wrap;gap:6px}

.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
details{border-top:1px solid var(--line);padding-top:8px;color:var(--mute)}
summary{cursor:pointer;font-weight:700;color:var(--fg)}
details p{margin:.5em 0;max-width:62ch}
/* ---------- the book and the studio ---------- */
#app{position:fixed;inset:0;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;color:var(--ink)}
.scene{position:absolute;inset:0;transition:opacity .45s ease,transform .55s cubic-bezier(.3,.1,.25,1)}
.scene.off{opacity:0;pointer-events:none}
#studio.away{opacity:0;transform:scale(2.6);pointer-events:none}
#bookwrap.off{transform:scale(.16)}
#studioSvg{width:100%;height:100%;overflow:visible}
#book{position:absolute;top:0;bottom:0;left:50%;width:min(100%,calc(100dvh * .62));transform:translateX(-50%)}
.boards{position:absolute;inset:5px 4px;border-radius:9px;background:var(--cloth);box-shadow:0 6px 18px var(--shadow);transition:background .6s}
.boards::after{content:"";position:absolute;top:16px;bottom:16px;right:5px;width:6px;background:repeating-linear-gradient(90deg,var(--paper2) 0 1.4px,transparent 1.4px 2.8px);opacity:.8}
.pages{position:absolute;left:14px;right:14px;top:14px;bottom:14px;perspective:1700px;overflow:hidden}
.pg{position:absolute;inset:0;border-radius:3px;background:var(--paper);overflow:hidden;transition:background .6s}
.leaf{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.45,.05,.3,1)}
.leaf.drag{transition:none}
.leaf.gone{visibility:hidden;pointer-events:none}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:3px;overflow:hidden}
.face.back{transform:rotateY(180deg);background:var(--paper2)}
.face.cover{background:var(--cloth)}
.face svg,.pg.toc svg{width:100%;height:100%;touch-action:manipulation}
/* the contents are ink on the same lamp-lit page (Sam, 2026-10-23): no paper of their own, so nothing behind them moves.
   While they show, the level's own things (the stage, the page number, the corner) are put away */
.pg.toc{background:none;box-shadow:none}
#lvpage.tocon .pstage{opacity:0;transition:opacity .35s ease;pointer-events:none}
#lvpage.tocon .pno,#lvpage.tocon .peel{opacity:0;transition:opacity .35s ease}
#lvpage.tocon .grab{display:none}
#lvpage.tocout .pno,#lvpage.tocout .peel{transition:opacity .6s ease .5s}
.phead.off{visibility:hidden;pointer-events:none}
#lvpage{display:flex;flex-direction:column}
.pstage{position:absolute;left:0;right:0;top:calc(66px + var(--sat));bottom:calc(34px + var(--sab));display:flex;align-items:center;justify-content:center}
.pstage #svg,.pstage > svg{width:100%;height:100%;max-height:100%}
.phead{position:absolute;left:12px;top:calc(10px + var(--sat));padding:4px 8px 5px;border:1px solid color-mix(in srgb,var(--ink) 30%,transparent);border-radius:8px;cursor:pointer;transform-origin:0 0;opacity:.62;background:transparent;transition:transform 1.2s cubic-bezier(.45,.05,.25,1),opacity 1.2s,background-color 1.2s,box-shadow 1.2s;pointer-events:auto;max-width:calc(50% - 56px)}   /* small, so the lamp keeps the top middle */

  // ---------- what a tap does (design options B and C) ----------
  // top of the connected chain above an instrument (or above the gate)
  // ---------- sound travelling ----------
  // sound dropped into the lift rides up it (no note of its own), then leaves on the lift's string
  // how long sound spends in the lift: riding up, then down its string
  // the lift is quick: sound rides up it at BELT times the time it would take on a string (slow enough to see the sponge ride)
  const BELT=.75;

  // ---------- hints ----------
  // A short line of plain text at the top of the stage in the early levels. Each one fades away as soon as you do
  // what it suggests, and the next (if any) fades in. Later levels have none.
  // Most hints are small moving cues, not words:
  //   tap  — a ring ripples out from the thing to tap, every few seconds
  //   drag — a faint dot leaves a loose string's end and glides along a dotted path to where it should go
  //   ring — an empty input ring gently glows bigger, saying "something goes here"

  // something would that wants your attention. A gate rattles its pipes and swings its tag; an instrument sways; a loose
  // string end tugs toward the ring it could go into (Fidget: a short tug; Reach: it stretches out but is too short, falls
  // back, and tries again a little further, never all the way); a wrong string that is connected tugs at its ring (Fidget) or
  // tries to lift off it, a little more each time, and settles back (Reach).
  const ease=k=>k*k*(3-2*k);

  // falls back with a little bounce, and the next try gets a bit further (never all the way). Every time the hint comes

  // Each source (the hint, your drag) asks for its own lift; the ring follows the sum.

  // HINTS THAT MOVE THINGS: the rules
  //  H1 A hint only starts after a few seconds with no touch.
  //  H2 A string hint uses a loose string picked at random (it may be a wrong one), so it never points at the right note.
  //  H3 The moment you touch any string, the hint gives way: whatever it moved eases back home (within about a quarter
  //     second) and stays out of your way. It never freezes mid-reach.
  // REACHING WHILE YOU DRAG: the rules (see REACH below for the numbers)
  //  1 Where:  only in the warm-up, chapter 1 of book one, and the level that first introduces a new element
  //            (the lift, the chord gate): a new thing gets the same help as the first levels did.
  //  2 When:   only once the first string hint has played on this level (you have gone a while without getting it),
  //            and only while you are dragging a string. It eases in over a second.
  //  3 Who:    only places your string is allowed to reach (below it). Right and wrong places reach the same way, so a
  //            reach never tells you which one is right.

      if(typeof window.__book.growHold==='number'||(rev?clock>0:clock<TE)) requestAnimationFrame(f);
      else if(rev){ ov.remove(); window.__book.growNow=null; src.style.visibility=''; sideBooks.forEach(s=>{ s.style.transform=''; s.style.opacity=''; }); moved.forEach(m=>m.removeAttribute('transform'));
        bookwrap.classList.add('off'); bookwrap.style.transform=''; bookwrap.style.opacity=''; requestAnimationFrame(()=>{ bookwrap.style.transition=''; studioEl.style.transition=''; }); drawStage(); done(); }
      else { ov.remove(); window.__book.growNow=null; src.style.visibility=''; sideBooks.forEach(s=>{ s.style.transform=''; s.style.opacity=''; }); bookwrap.style.transform=''; bookwrap.style.opacity=''; bookwrap.style.transition='';
        moved.forEach(m=>m.removeAttribute('transform')); finish(); drawStage(); } })(); }
  function openLevel(i){ if(shell.busy) return; wake(); shell.busy=true;
    if(shell.leaf){ shell.leaf.remove(); shell.leaf=null; }
    const fresh=i!==shell.loaded||shell.dirty||svg.parentNode!==pstage||!svg.firstChild;
    const from=$('tocSvg').querySelector(`text[data-ch="${LEVELS[i].ch}"]`);
    homeSvg(); if(fresh){ shell.dirty=false; shell.fold=true; goLevel(i); } else setLabels(i,false);
    headIn(from); tocSketch(false,()=>{ tocMode(false); shell.busy=false; pageArrive(); }); }
  // THE CHAPTER'S TITLE CARRIES YOU IN AND OUT (Sam, 2026-10-23: going from the contents into a chapter has to read as one
  // move). Picking a page: its chapter's title on the contents turns into the running head and glides up to its corner as
  // the rest is rubbed out and the page sketches itself in. Going back, the head glides down onto its line in the contents.
  // (The warm-up has no chapter line, so its head just fades.)
  function tocMode(on){ lvpage.classList.toggle('tocon',on); lvpage.classList.toggle('tocout',!on); if(!on) setTimeout(()=>{ if(!lvpage.classList.contains('tocon')) lvpage.classList.remove('tocout'); },1300); }
  // [x,y,scale] for the head (its transform-origin is its top left) that lays its title over the text t
  function headOver(t){ const tr=phead.style.transform; phead.style.transform='none'; const r=phead.getBoundingClientRect(),h=phead.querySelector('.hname').getBoundingClientRect(); phead.style.transform=tr;
    const T=t.getBoundingClientRect(),s=T.height/Math.max(1,h.height);
    return [T.left-r.left-s*(h.left-r.left),T.top+T.height/2-r.top-s*(h.top+h.height/2-r.top),s]; }
  function headNow(){ const v=getComputedStyle(phead).transform,m=v&&v!=='none'?new DOMMatrix(v):new DOMMatrix(); return [m.e,m.f,m.a]; }
  const HG={inn:1150,out:1000};   // how long the head takes to glide up into its corner, and back down onto the contents
  function headGlide(tok,a,b,ms,op,each,cb,hold=.18){ const t0=performance.now(),ez=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,cl=v=>Math.max(0,Math.min(1,v));
    (function f(){ if(tok!==headTok) return; const p=cl((performance.now()-t0)/ms),q=ez(cl((p-hold)/(1-hold))),v=a.map((x,k)=>x+(b[k]-x)*q);
      phead.style.transition='none'; phead.style.transform=`translate(${v[0].toFixed(1)}px,${v[1].toFixed(1)}px) scale(${v[2].toFixed(4)})`; phead.style.opacity=op(p).toFixed(3); if(each) each(p);
      if(p<1) requestAnimationFrame(f); else if(cb) cb(); })(); }
  function headIn(t){ const tok=++headTok,big=shell.big,endTr=phead.style.transform,b=headNow(),o1=big?.85:.62;
    phead.classList.remove('off');
    const fin=()=>{ phead.style.transition=big?'opacity .5s ease':''; phead.style.transform=endTr; phead.style.opacity=big?'.85':''; };
    if(t) t.style.transition='none';   /* (the contents' text has a slow fade of its own) */
    if(!t){ headGlide(tok,b,b,HG.inn*.7,p=>o1*Math.max(0,(p-.4)/.6),null,fin); return; }
    headGlide(tok,headOver(t),b,HG.inn,p=>p<.13?.85*p/.13:.85+(o1-.85)*(p-.13)/.87,p=>{ t.style.opacity=Math.max(0,1-p/.13).toFixed(3); },fin,.1); }   /* a quick crossfade, so the two titles are never long on top of each other */
  function headOut(t){ const tok=++headTok,a=headNow(),o0=+getComputedStyle(phead).opacity||.62; clearTimeout(shell.bigT); shell.big=false; phead.classList.remove('stamp'); phead.style.pointerEvents='none';
    const fin=()=>{ phead.classList.add('off'); phead.style.transition='none'; phead.style.transform=''; phead.style.opacity=''; phead.style.pointerEvents=''; phead.getBoundingClientRect(); phead.style.transition=''; if(t) t.style.opacity=''; };
    if(!t){ headGlide(tok,a,a,500,p=>o0*(1-p),null,fin); return; }
    t.style.transition='none'; t.style.opacity='0';
    headGlide(tok,a,headOver(t),HG.out,p=>p<.78?o0+(.9-o0)*p/.78:.9*(1-p)/.22,p=>{ t.style.opacity=Math.max(0,(p-.74)/.26).toFixed(3); },fin); }
  // THE CONTENTS COME AND GO LIKE ANY PAGE (Sam, 2026-10-22): no page turn. The level is rubbed out (eraseOut) and the
  // contents sketch themselves in behind a pencil edge coming down the page; picking a level rubs the contents out and the
  // level sketches itself in (playPopup)
  function tocSketch(show,cb){ const s=$('tocSvg'),t0=performance.now(),ms=show?SK.ink[0]+SK.ink[1]:ER.erase[0]+ER.erase[1],cl=v=>Math.max(0,Math.min(1,v));
    if(show){ s.style.clipPath='inset(0 0 100% 0)'; placeLeaf(tocLeaf,false,10); }
    (function f(){ const t=performance.now()-t0;
      if(show){ const pen=cl(t/SK.pen); s.style.clipPath=pen<1?`inset(0 0 ${((1-pen)*100).toFixed(1)}% 0)`:''; s.style.opacity=(.4+.6*cl((t-SK.ink[0])/SK.ink[1])).toFixed(3); }
      else s.style.opacity=(1-cl((t-ER.erase[0])/ER.erase[1])).toFixed(3);
      if(t<ms) requestAnimationFrame(f); else { s.style.clipPath=''; s.style.opacity=''; if(!show) placeLeaf(tocLeaf,true,10); if(cb) cb(); } })(); }
  function goContents(){ if(shell.busy||shell.turning) return; shell.busy=true; hush(300); if(st) clearHelp(true);
    if(shell.leaf){ shell.leaf.remove(); shell.leaf=null; }
    const show=()=>{ [PP.cv,PP.sv,PP.tv].forEach(e=>{ if(e) e.style.opacity=''; }); shell.dirty=true; spotOff(); buildToc(); tocMode(true);
      tocSketch(true,()=>{ shell.busy=false; }); headOut(L&&!L.final?$('tocSvg').querySelector(`text[data-ch="${LEVELS[opts.level].ch}"]`):null); };   // (the rubbed-out level is drawn afresh when you come back)
    if(st&&L&&!L.final&&svg.parentNode===pstage) eraseOut(show); else show(); }
  // the close button: one way to close the book, the same from a level or the contents
  $('bclose').addEventListener('click',e=>{ e.stopPropagation(); if(shell.busy||shell.turning||shell.where!=='book') return; closeBook(); });
  $('bclose').classList.add('c-tab');   // the close button: a cloth tab hanging from the top
  // the book's frame: an open book. The left page shows at the side; tapping it turns back to the contents
  $('book').classList.add('f-open');
  document.querySelector('.lpage').addEventListener('click',e=>{ e.stopPropagation(); if(shell.where==='book') goContents(); });
  // the running head (chapter and what to listen for) is the way back to the contents
  phead.addEventListener('click',e=>{ e.stopPropagation(); goContents(); });
  // the book is closed only from the contents (its ribbon): an open design question if that turns out annoying or unclear
  function closeBook(then){ window.__plog&&window.__plog('close',{level:LEVELS[opts.level].final?'Recital':LEVELS[opts.level].name,solved:done.has(opts.level)}); shell.busy=true; hush(400); if(st) clearHelp(true); cornerOff();
    if(shell.leaf){ shell.leaf.remove(); shell.leaf=null; }
    shell.dirty=true;   // back from the studio, the page is played again from the start (notes asleep, pop-up folded)
    svg.style.opacity=''; phead.style.opacity=''; pno.style.opacity=''; peelEl.style.opacity='';
    // the opening, backwards (Sam): the page folds back into the book on its shelf; then anything newly free is let go
    shell.where='studio';
    growOpen(shell.book||'one',()=>{ buildToc(); shell.busy=false; setRibbon(); padTick.style.opacity=WARM.every(i=>done.has(i))?1:0; resumeReh();
      setTimeout(()=>{ applyGate(true); then&&then(); },200); },true); }
  function enterStage(){ if(shell.busy||shell.where!=='studio') return; wake(); shell.busy=true; hushReh(); document.documentElement.dataset.book='one';
    stw('away',1,800); stw('top',-20,1000,()=>{
      $('stageframe').appendChild(svg); svg.style.opacity=''; shell.where='stage'; goLevel(RECITAL);
      stagewrap.classList.remove('off'); setTimeout(()=>{ shell.busy=false; },700); }); }
  function exitStage(){ if(shell.where!=='stage'||shell.busy) return; shell.busy=true; hush(500);
    clearLater(); if(st&&st.perf){ st.perf.done=true; warmStop(); } stagewrap.classList.add('off'); shell.where='studio';
    setTimeout(()=>{ stw('top',pyS(484),900); stw('away',0,900,()=>{ shell.busy=false; resumeReh(); }); },350); }
  $('stageback').addEventListener('click',e=>{ e.stopPropagation(); exitStage(); });
  spineOne.addEventListener('click',()=>openBook('one'));
  padG.addEventListener('click',()=>openBook('warm'));
  [spineTwo,spineThree].forEach(sp=>sp.addEventListener('click',()=>{ animate(500,p=>sp.setAttribute('transform',`rotate(${(Math.sin(p*Math.PI*4)*2*(1-p)).toFixed(2)} ${SP.x+40} ${SP.y+SP.h})`),()=>sp.removeAttribute('transform')); }));   // locked: it rocks a little

  // ---------- saved progress (on this device) ----------
  // What you've done survives closing or reloading the page: levels solved (with each one's history of tries), the first
  // launch, chapters seen, moves known, the stage unlocked, books opened, and the difficulty. Levels are kept by name, so
  // adding or moving a level doesn't shift them. A level you leave half done starts again.
  const TESTER=true;   // the tester link: the play log is on, and debug items marked data-dev are hidden
  const BUILD='v68 tester',SAVE_KEY='hmmony.save';   // the debug menu opens from the window (or 5 taps on the contents' title, or #debug)
  // THE PLAY LOG (tester link only). Every visit writes what happens to this artifact's own store, so it can be read
  // back without anyone copying anything: the page opened, each page started and left, wrong tries (which notes),
  // solved (with mistakes), hints shown, difficulty changes and debug resets. Each event carries the build, this device,
  // this visit, and the run: a debug reset starts a new run, so a reset never mixes two plays together. Events wait on
  // the device until the store can be reached, so none are lost offline or before the viewer allows it.
  const plog=(()=>{ const off=()=>{}; off.flush=()=>Promise.resolve(); off.newRun=()=>{}; if(!TESTER) return off;
    const QK='hmmony.logq',ls=(k,v)=>{ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){} return null; };
    const rid=()=>Math.random().toString(36).slice(2,10),dev=ls('hmmony.dev')||(ls('hmmony.dev',rid()),ls('hmmony.dev')||rid()),visit=rid();
    let q=[]; try{ q=JSON.parse(ls(QK)||'[]'); }catch(e){} let run=+(ls('hmmony.run')||1),col=null,busy=null,page=null;
    const keep=()=>ls(QK,JSON.stringify(q.slice(-3000)));
    // hosted: each batch goes to the play-log sheet (a Google Apps Script web app); who is playing comes from ?t=name
    const LOG_URL='https://script.google.com/macros/s/AKfycbw_BGsh80nRWd_PLCHahzEhBxfvJy6EsL7Ur1l9XNAixYrzjvk7vsUuzwoCZBAQWpk/exec',tester=(new URLSearchParams(location.search).get('t')||ls('hmmony.tester')||'').slice(0,40); if(tester) ls('hmmony.tester',tester);
    let soon=0; col=true;
    function flush(){ if(busy) return busy; if(!q.length||!LOG_URL) return Promise.resolve(); const batch=q.slice(0,200);
      return busy=fetch(LOG_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(batch),keepalive:true})
        .then(()=>{ q.splice(0,batch.length); keep(); },()=>{}).then(()=>{ busy=null; }); }
    setInterval(flush,8000);
    addEventListener('pagehide',()=>{ if(q.length&&navigator.sendBeacon&&navigator.sendBeacon(LOG_URL,JSON.stringify(q.slice(0,200)))){ q.splice(0,200); keep(); } });
    const f=(type,data)=>{ const t=Date.now(),e=Object.assign({type,t,build:BUILD,tester,dev,visit,run},data||{});
      if(type==='page'){ if(page&&page.level===e.level&&t-page.t<2000) return; page={level:e.level,t}; }   // (a page redrawn for a switch is not a new start)
      if((type==='solved'||type==='close')&&page&&page.level===e.level) e.ms=t-page.t;
      q.push(e); keep(); clearTimeout(soon); soon=setTimeout(flush,1500); };
    f.flush=flush; f.newRun=()=>{ run++; ls('hmmony.run',String(run)); };
    return f; })();
  window.__plog=plog;
  if(TESTER) document.documentElement.classList.add('tester');
  const nameOf=i=>LEVELS[i].final?'Recital':LEVELS[i].name,byName=n=>LEVELS.findIndex((_,i)=>nameOf(i)===n);
  let frSeen=false,resetting=false,lastSave='';
  function snapshot(){ const pages={}; Object.keys(ear.pages).forEach(i=>{ pages[nameOf(+i)]=ear.pages[i]; });
    frSeen=frSeen||shell.opened.size>0||done.size>0;
    return JSON.stringify({v:1,build:BUILD,fr:frSeen,done:[...done].map(nameOf),pages,seen:[...seenCh],skills:[...skills],unlocked:!!shell.unlocked,opened:[...shell.opened],dial:opts.dial}); }
  function save(){ if(resetting) return; const s=snapshot(); if(s===lastSave) return; lastSave=s; try{ localStorage.setItem(SAVE_KEY,s); }catch(e){} }
  function readSave(){ try{ const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null'); return s&&s.v===1?s:null; }catch(e){ return null; } }
  function restore(s){
    done.clear(); (s.done||[]).map(byName).forEach(i=>{ if(i>=0) done.add(i); });
    ear.pages={}; Object.entries(s.pages||{}).forEach(([n,r])=>{ const i=byName(n); if(i>=0) ear.pages[i]=r; });

    (s.skills||[]).forEach(k=>skills.add(k));
    (s.opened||[]).forEach(k=>shell.opened.add(k));
    if(s.unlocked){ shell.unlocked=true; SV.lock=0; SV.lockFall=1; drawStage(); }
    if(BANDS.includes(s.dial)){ opts.dial=s.dial; document.querySelectorAll('.seg[data-k="dial"] button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.v===opts.dial))); }
    frSeen=!!s.fr;
    done.forEach(i=>SKY.shown.add(i)); drawSky(false); setRibbon(); buildDone(); applyGate(false); }
  // the debug resets: write the state, then reload so everything starts from it
  function resetTo(which){ const rec=()=>({hist:[],base:0,band:band()}),names=f=>LEVELS.map((l,i)=>f(l)?nameOf(i):null).filter(Boolean),
      pagesOf=ns=>Object.fromEntries(ns.map(n=>[n,rec()])),W=names(l=>l.tut),ALL=names(()=>true);
    const s=which==='warm'?{v:1,fr:true,done:W,pages:pagesOf(W),seen:[],skills:['drag'],unlocked:false,opened:['warm'],dial:opts.dial}
      :which==='book1'?{v:1,fr:true,done:ALL,pages:pagesOf(ALL),seen:[...new Set(LEVELS.map(l=>l.ch))],skills:['drag'],unlocked:true,opened:['warm','one'],dial:opts.dial}
      :{v:1,fr:false,done:[],pages:{},seen:[],skills:[],unlocked:false,opened:[],dial:opts.dial};
    resetting=true; try{ localStorage.setItem(SAVE_KEY,JSON.stringify(s)); }catch(e){}
    plog('reset',{to:which}); plog.newRun(); Promise.race([plog.flush(),new Promise(r=>setTimeout(r,2000))]).then(()=>location.reload()); }
  document.querySelectorAll('[data-reset]').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation(); resetTo(b.dataset.reset); }));
  { const bn=$('buildno'); if(bn) bn.textContent='Build '+BUILD; }
  $('gear').style.display='none';   // the window opens the menu instead
  { const s=readSave(); if(s) restore(s); lastSave=s?snapshot():'';
    // no save yet, or closed before the first launch was through: it plays (players asleep, then the warm-up)
    if(!s||!s.fr) (function go(n){ if(shell.where==='studio'&&!shell.busy) frStart('you'); else if(n<40) setTimeout(()=>go(n+1),250); })(0); }
  plog('open',{solved:done.size,w:innerWidth,h:innerHeight,ua:navigator.userAgent.slice(0,160)});
  setInterval(save,1000);
  window.addEventListener('pagehide',save); document.addEventListener('visibilitychange',()=>{ if(document.hidden) save(); });
  window.__book.save={read:readSave,resetTo,snapshot:()=>JSON.parse(snapshot())};   // (for testing)

  // ---------- the debug drawer ----------
  const dbg=$('debug');

  // the painted world is paper in every light, as in the prototype: night is the lamp, not a dark theme. So the default

  function applyTheme(){ document.documentElement.setAttribute('data-theme','light'); }   // (the dark theme is cut, Sam 2026-10-21)

  applyTheme(); applyLight(light0); shell.applyLight=applyLight;
  shell.applyTheme=applyTheme; shell.applyGate=applyGate; shell.buildDone=buildDone;
  Object.assign(window.__book,{openBook,openLevel,goContents,closeBook,completeTurn,enterStage,exitStage,unlockStage,toggleDebug,done,ear});

})();
